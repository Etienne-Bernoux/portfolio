      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', Menlo, monospace; }
      .sans { font-family: Inter, 'Helvetica Neue', Helvetica, sans-serif; }
    </style>
